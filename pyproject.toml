[project]
name = "agentic-ai-interview-prep"
version = "1.0.0"
description = "360 Telco BSS / FinTech agentic-AI anti-pattern scenarios, a Claude interview coach, and Architecture Review."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "anthropic>=0.40", "mcp>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "cairosvg>=2.7"]

[project.scripts]
aap-coach = "antipatterns.cli:main"
aap-mcp = "antipatterns.mcp_entry:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
