name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Validate catalog, rules and reference architectures
        run: python scripts/validate.py
      - name: Tests (renderer and review parity, agent loop, MCP server)
        run: pytest -q
      - name: Skill bundle is in sync with src/ and content/
        run: python scripts/build_skill.py --check
      - name: Build skill zip and website
        run: |
          python scripts/build_skill.py
          python scripts/build_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: agentic-ai-coach-skill
          path: dist/agentic-ai-coach.zip
