<rect x="458.3" y="342" width="181.7" height="56" rx="8" stroke-width=".5"/><text class="bt" x="549.2" y="360" text-anchor="middle" dominant-baseline="central">Review engine</text><text class="bs" x="549.2" y="380" text-anchor="middle" dominant-baseline="central">Rules, fix, render</text></g><g class="k-neutral"><rect x="35" y="486" width="181.7" height="56" rx="8" stroke-width=".5"/><text class="bt" x="125.8" y="504" text-anchor="middle" dominant-baseline="central">360 scenarios</text><text class="bs" x="125.8" y="524" text-anchor="middle" dominant-baseline="central">YAML catalog</text></g><g class="k-neutral"><rect x="246.7" y="486" width="181.7" height="56" rx="8" stroke-width=".5"/><text class="bt" x="337.5" y="504" text-anchor="middle" dominant-baseline="central">Progress DB</text><text class="bs" x="337.5" y="524" text-anchor="middle" dominant-baseline="central">SQLite</text></g><g class="k-neutral"><rect x="458.3" y="486" width="181.7" height="56" rx="8" stroke-width=".5"/><text class="bt" x="549.2" y="504" text-anchor="middle" dominant-baseline="central">Rules + designs</text><text class="bs" x="549.2" y="524" text-anchor="middle" dominant-baseline="central">22 rules, 10 refs</text></g><text class="cap" x="340" y="586" text-anchor="middle">Purple = LLM, teal = deterministic, gray = data</text></svg>