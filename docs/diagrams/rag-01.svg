<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 296" role="img"><title>Fixed-size chunking splits the roaming tariff table</title><desc>Anti-pattern: tariff PDF cut every 512 tokens: Roaming PDF (Zones x plans) then Split at 512 (Ignores layout) then Chunk 14 (Rates, no plans) then Wrong quote (Bill shock); Fix: row-level chunks, prices from the catalog: Layout parser (Table detected) then Row chunks (Plan+zone+rate) then Price tool (TMF620 catalog) then Grounded (Cites offer ID)</desc><style>.ln{fill:#FAF9F5;stroke:#B4B2A9;stroke-width:.5;stroke-dasharray:4 4}.lt{font:500 14px system-ui,-apple-system,Segoe UI,sans-serif;fill:#2C2C2A}.bt{font:500 14px system-ui,-apple-system,Segoe UI,sans-serif}.bs{font:400 12px system-ui,-apple-system,Segoe UI,sans-serif}.lb{fill:#FAF9F5}.cap{font:400 12px system-ui,-apple-system,Segoe UI,sans-serif;fill:#5F5E5A}.ar{stroke:#888780;stroke-width:1.5;fill:none}.k-bad rect{fill:#FCEBEB;stroke:#A32D2D}.k-bad .bt{fill:#791F1F}.k-bad .bs{fill:#A32D2D}.k-good rect{fill:#E1F5EE;stroke:#0F6E56}.k-good .bt{fill:#085041}.k-good .bs{fill:#0F6E56}.k-agent rect{fill:#EEEDFE;stroke:#534AB7}.k-agent .bt{fill:#3C3489}.k-agent .bs{fill:#534AB7}.k-neutral rect{fill:#F1EFE8;stroke:#5F5E5A}.k-neutral .bt{fill:#444441}.k-neutral .bs{fill:#5F5E5A}.mk circle{fill:#E24B4A;stroke:#A32D2D}.mk text{font:500 12px system-ui,sans-serif;fill:#FFFFFF}@media (prefers-color-scheme:dark){.ln{fill:#262624;stroke:#5F5E5A}.lt{fill:#F1EFE8}.lb{fill:#262624}.cap{fill:#B4B2A9}.ar{stroke:#B4B2A9}.k-bad rect{fill:#791F1F;stroke:#F09595}.k-bad .bt{fill:#FCEBEB}.k-bad .bs{fill:#F7C1C1}.k-good rect{fill:#085041;stroke:#5DCAA5}.k-good .bt{fill:#E1F5EE}.k-good .bs{fill:#9FE1CB}.k-agent rect{fill:#3C3489;stroke:#AFA9EC}.k-agent .bt{fill:#EEEDFE}.k-agent .bs{fill:#CECBF6}.k-neutral rect{fill:#444441;stroke:#B4B2A9}.k-neutral .bt{fill:#F1EFE8}.k-neutral .bs{fill:#D3D1C7}}</style><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect class="ln" x="20" y="20" width="640" height="118" rx="12"/><text class="lt" x="40" y="44">Anti-pattern: tariff PDF cut every 512 tokens</text><g class="k-bad"><rect x="35" y="62" width="133.3" height="56" rx="8" stroke-width=".5"/><text class="bt" x="101.6" y="80" text-anchor="middle" dominant-baseline="central">Roaming PDF</text><text class="bs" x="101.6" y="100" text-anchor="middle" dominant-baseline="central">Zones x plans</text></g><line class="ar" x1="169.3" y1="90" x2="190.3" y2="90" marker-end="url(#ah)"/><g class="k-bad"><rect x="192.3" y="62" width="133.3" height="56" rx="8" stroke-width=".5"/><text class="bt" x="258.9" y="80" text-anchor="middle" dominant-baseline="central">Split at 512</text><text class="bs" x="258.9" y="100" text-anchor="middle" dominant-baseline="central">Ignores layout</text></g><line class="ar" x1="326.5" y1="90" x2="347.5" y2="90" marker-end="url(#ah)"/><g class="k-bad"><rect x="349.5" y="62" width="133.3" height="56" rx="8" stroke-width=".5"/><text class="bt" x="416.1" y="80" text-anchor="middle" dominant-baseline="central">Chunk 14</text><text class="bs" x="416.1" y="100" text-anchor="middle" dominant-baseline="central">Rates, no plans</text></g><line class="ar" x1="483.8" y1="90" x2="504.8" y2="90" marker-end="url(#ah)"/><g class="k-bad"><rect x="506.8" y="62" width="133.3" height="56" rx="8" stroke-width=".5"/><text class="bt" x="573.4" y="80" text-anchor="middle" dominant-baseline="central">Wrong quote</text><text class="bs" x="573.4" y="100" text-anchor="middle" dominant-baseline="central">Bill shock</text></g><rect class="ln" x="20" y="158" width="640" height="118" rx="12"/><text class="lt" x="40" y="182">Fix: row-level chunks, prices from the catalog</text><g class="k-good"><rect x="35" y="200" width="133.3" height="56" rx="8" stroke-width=".5"/><text class="bt" x="101.6" y="218" text-anchor="middle" dominant-baseline="central">Layout parser</text><text class="bs" x="101.6" y="238" text-anchor="middle" dominant-baseline="central">Table detected</text></g><line class="ar" x1="169.3" y1="228" x2="190.3" y2="228" marker-end="url(#ah)"/><g class="k-good"><rect x="192.3" y="200" width="133.3" height="56" rx="8" stroke-width=".5"/><text class="bt" x="258.9" y="218" text-anchor="middle" dominant-baseline="central">Row chunks</text><text class="bs" x="258.9" y="238" text-anchor="middle" dominant-baseline="central">Plan+zone+rate</text></g><line class="ar" x1="326.5" y1="228" x2="347.5" y2="228" marker-end="url(#ah)"/><g class="k-good"><rect x="349.5" y="200" width="133.3" height="56" rx="8" stroke-width=".5"/><text class="bt" x="416.1" y="218" text-anchor="middle" dominant-baseline="central">Price tool</text><text class="bs" x="416.1" y="238" text-anchor="middle" dominant-baseline="central">TMF620 catalog</text></g><line class="ar" x1="483.8" y1="228" x2="504.8" y2="228" marker-end="url(#ah)"/><g class="k-good"><rect x="506.8" y="200" width="133.3" height="56" rx="8" stroke-width=".5"/><text class="bt" x="573.4" y="218" text-anchor="middle" dominant-baseline="central">Grounded</text><text class="bs" x="573.4" y="238" text-anchor="middle" dominant-baseline="central">Cites offer ID</text></g></svg>