id: tool-design-mcp
order: 14
prefix: tool
title: Tool Design & MCP
summary: >-
  Tools are the agent's hands, and their design decides most of an agent's reliability.
  Good tools are task-shaped, typed, documented like an API for a new hire, safe to
  retry, authorised per object, observable and versioned. MCP standardises how tools are
  exposed, but it doesn't make a badly designed tool safe.
scenarios:
  - id: tool-01
    title: Agent given a raw SQL tool on the billing database
    domain: telco
    severity: critical
    tags: [task-shaped tools, sql, least privilege]
    scenario: >-
      To move fast, a carrier gives its care agent a run_sql tool on a read replica of the
      billing database. The agent writes queries that scan entire tables at peak (slowing
      the replica used by billing reports), and a prompt injection gets it to return other
      customers' invoices.
    analogy: >-
      Handing a visitor the keys to the archive room instead of fetching the file they
      need.
    breaks:
      - Generic power with no business boundaries.
      - No object-level authorisation.
      - Unpredictable load on shared systems.
    root_cause: >-
      Exposing raw data access instead of task-shaped tools.
    where: Tool design.
    fix:
      - Replace raw SQL with task-shaped tools (get_invoice_summary(account_id, period)) that enforce ownership and limits.
      - If analytics needs SQL, use parameterised templates on a dedicated store with row-level security and query limits.
      - Rate-limit and time-box tools that hit shared systems.
    detect:
      - Query cost and cross-account access per tool.
    tradeoff: >-
      Less flexibility; more tools to build.
    variant: >-
      FinTech: an agent with SQL access to the core-banking reporting database exposes
      balances of other customers.
    line: Give agents verbs for the business, not a shell into the database.
    related: [rag-12, sec-04]
    diagram:
      bad_label: "Anti-pattern: raw SQL tool on the billing DB"
      good_label: "Fix: task-shaped tools with ownership and limits"
      bad: [["run_sql", "Billing replica"], ["Full scans", "At peak"], ["Injection", "Other invoices"], ["Load + leak", "Both"]]
      good: [["get_invoice", "Task-shaped"], ["Owner check", "Account"], ["Limits", "Rows, time"], ["Templates", "For analytics"]]

  - id: tool-02
    title: Wire value date in the wrong time zone
    domain: fintech
    severity: high
    tags: [dates, time zones, parameters]
    scenario: >-
      A corporate-banking agent schedules a wire "for tomorrow" for a client in Singapore.
      The tool takes value_date as a date with no time zone, and the agent computes
      "tomorrow" in UTC. The wire is scheduled a day late and misses a supplier deadline,
      incurring penalties.
    analogy: >-
      Booking a meeting "at 9" without saying whose 9.
    breaks:
      - Relative dates resolved by the model.
      - No time-zone context in the tool.
      - Cut-off times and business days ignored.
    root_cause: >-
      Ambiguous temporal parameters.
    where: Tool interface.
    fix:
      - Provide a date-resolution tool or resolve relative dates in code using the client's time zone and calendar.
      - Require explicit dates with time zone, and validate against cut-off times and holidays.
      - Echo the resolved date in confirmation.
    detect:
      - Mismatches between requested and executed dates.
    tradeoff: >-
      None significant.
    variant: >-
      Telco: a technician visit "tomorrow morning" is booked in the data centre's time zone.
    line: Never let the model guess what tomorrow means.
    related: [agf-04, aev-10]
    diagram:
      bad_label: "Anti-pattern: relative dates resolved by the model"
      good_label: "Fix: date tool with time zone, calendar and cut-offs"
      bad: [["'Tomorrow'", "Singapore client"], ["Model computes", "In UTC"], ["Day late", "Value date"], ["Penalty", "Supplier"]]
      good: [["Date tool", "Client TZ"], ["Calendar", "Holidays"], ["Cut-off check", "Validate"], ["Confirm", "Resolved date"]]

  - id: tool-03
    title: get_bill, get_invoice and get_statement all exist
    domain: telco
    severity: medium
    tags: [overlapping tools, naming]
    scenario: >-
      A carrier's agent has three tools that return billing information from different
      systems: get_bill (legacy), get_invoice (new billing) and get_statement (finance).
      The agent picks inconsistently and gives customers numbers from the legacy system
      for accounts already migrated.
    analogy: >-
      Three phone numbers for the same department, one of which goes to an empty office.
    breaks:
      - Overlapping tools with vague differences.
      - Legacy tools never retired.
      - The model can't tell which is current.
    root_cause: >-
      Tool set mirrors system history, not tasks.
    where: Tool catalogue design.
    fix:
      - Expose one tool per task (get_bill_summary) that routes internally to the right system based on migration status.
      - Retire or hide legacy tools.
      - Name and describe tools by what they're for and when not to use them.
    detect:
      - Tool-selection confusion in traces.
    tradeoff: >-
      Routing logic moves into the tool layer.
    variant: >-
      FinTech: transfer, payment and send_money tools overlap, and the agent picks a slower
      rail.
    line: One task, one tool. Hide the plumbing.
    related: [agf-03]
    diagram:
      bad_label: "Anti-pattern: overlapping tools from different systems"
      good_label: "Fix: one task-shaped tool that routes internally"
      bad: [["get_bill", "Legacy"], ["get_invoice", "New system"], ["get_statement", "Finance"], ["Wrong numbers", "Migrated"]]
      good: [["One tool", "Bill summary"], ["Routes", "By migration"], ["Hide legacy", "Retired"], ["Clear docs", "When to use"]]

  - id: tool-04
    title: Transaction tool returns 10,000 rows
    domain: fintech
    severity: medium
    tags: [pagination, filtering, output size]
    scenario: >-
      A business-banking agent calls get_transactions(account) for a corporate account.
      The tool returns 10,000 transactions for the year. The response exceeds the context
      limit and the call fails, or is truncated and the agent analyses partial data.
    analogy: >-
      Asking for a book and being handed the whole library.
    breaks:
      - No filtering or pagination parameters.
      - Output size is unbounded.
      - Truncation is silent.
    root_cause: >-
      Tools without size controls.
    where: Tool design.
    fix:
      - Add filters (date range, amount, counterparty, category) and pagination with a sensible default page size.
      - Return totals and counts with each page, and say when more pages exist.
      - Provide aggregate tools for summary questions.
    detect:
      - Response sizes and truncation events per tool.
    tradeoff: >-
      More parameters to document.
    variant: >-
      Telco: get_usage returns every data session for a month on an IoT account with
      thousands of SIMs.
    line: Every list tool needs filters, pages and totals.
    related: [agf-10]
    diagram:
      bad_label: "Anti-pattern: unbounded list tool"
      good_label: "Fix: filters, pagination, totals, aggregates"
      bad: [["get_txns", "Whole year"], ["10,000 rows", "Returned"], ["Over limit", "Or truncated"], ["Partial data", "Analysed"]]
      good: [["Filters", "Date, amount"], ["Pages", "Default size"], ["Totals", "And has_more"], ["Aggregate", "Summary tool"]]

  - id: tool-05
    title: Plan change executed without a preview
    domain: telco
    severity: high
    tags: [dry run, preview, confirmation]
    scenario: >-
      A carrier's agent has a change_plan tool that executes immediately. Customers don't
      see the prorated charges, lost promotions or device-installment effects until the
      next bill. Plan-change complaints and reversals rise.
    analogy: >-
      A checkout that charges your card before showing the basket total.
    breaks:
      - No dry-run or quote mode.
      - Side effects aren't shown before execution.
      - Confirmation is based on the model's description.
    root_cause: >-
      Write tools without a preview step.
    where: Tool design.
    fix:
      - Split into preview_plan_change (returns prorated charges, promotions lost, effective date) and execute_plan_change (requires the preview id).
      - Show the preview to the customer and require explicit confirmation.
      - Use TMF679 product offering qualification or a quote API for eligibility and effects.
    detect:
      - Reversal and complaint rates after plan changes.
    tradeoff: >-
      One more step in the flow.
    variant: >-
      FinTech: a loan-restructure tool executes without showing the new payment schedule
      and total interest.
    line: Preview before you commit.
    related: [agf-19, gov-02]
    diagram:
      bad_label: "Anti-pattern: change executes immediately"
      good_label: "Fix: preview tool, confirmation, execute with preview id"
      bad: [["change_plan", "Executes now"], ["No preview", "Proration"], ["Promo lost", "Hidden"], ["Complaints", "Reversals"]]
      good: [["Preview", "Charges, effects"], ["Show customer", "Confirm"], ["Execute", "Preview id"], ["Eligibility", "TMF679"]]

  - id: tool-06
    title: Bulk suspension reports success when 3 of 50 lines failed
    domain: telco
    severity: high
    tags: [partial failure, bulk operations, result reporting]
    scenario: >-
      An enterprise customer asks the agent to suspend 50 lines reported stolen in an
      office burglary. The bulk tool returns "success" because the batch was accepted.
      Three lines failed provisioning and stayed active. Fraudulent international calls
      on those lines cost $8,000.
    analogy: >-
      A courier reporting "all delivered" when three parcels were returned.
    breaks:
      - Bulk tools report batch acceptance, not per-item outcomes.
      - The agent tells the customer everything is done.
      - No follow-up on failures.
    root_cause: >-
      Coarse success semantics for bulk operations.
    where: Tool response design.
    fix:
      - Return per-item results (succeeded, failed with reason, pending) and overall counts.
      - Make the agent report failures explicitly and retry or escalate them.
      - Track asynchronous completion to the final state.
    detect:
      - Items still active after bulk suspension requests.
    tradeoff: >-
      Larger responses for bulk calls; summarise counts plus failures only.
    variant: >-
      FinTech: a bulk card-block request reports success while two cards remain active.
    line: Bulk tools must report per-item truth.
    related: [aev-12, tool-12]
    diagram:
      bad_label: "Anti-pattern: batch accepted reported as success"
      good_label: "Fix: per-item results, explicit failures, follow-up"
      bad: [["50 lines", "Suspend"], ["'Success'", "Batch accepted"], ["3 failed", "Still active"], ["$8k fraud", "Calls"]]
      good: [["Per-item", "Results"], ["Counts", "OK, failed"], ["Report", "Failures"], ["Retry", "Or escalate"]]

  - id: tool-07
    title: Statement tool trusts the account id the model supplies
    domain: fintech
    severity: critical
    tags: [idor, authorization, tools]
    scenario: >-
      A bank's get_statement tool takes account_id as a parameter and returns the
      statement. The agent normally passes the customer's own account, but a user asks
      "show me the statement for account 4471-2208" and the agent passes it through. The
      tool returns another customer's statement.
    analogy: >-
      A post office that hands over any parcel if you can read out the tracking number.
    breaks:
      - The tool trusts identifiers from the model.
      - No check that the account belongs to the authenticated user.
      - Classic insecure direct object reference.
    root_cause: >-
      Missing object-level authorisation in tools.
    where: Tool authorisation.
    fix:
      - Derive the user's identity from the session, not from tool arguments.
      - Check that every requested object belongs to (or is delegated to) that identity.
      - Prefer tools that take no account id for "my account" questions.
    detect:
      - Authorisation failures per tool; cross-account attempts.
    tradeoff: >-
      None significant.
    variant: >-
      Telco: a get_call_records tool returns records for any phone number passed (see
      sec-04).
    line: Identity comes from the session, never from the prompt.
    related: [sec-04, agf-12]
    diagram:
      bad_label: "Anti-pattern: tool trusts model-supplied ids"
      good_label: "Fix: identity from session, object-level checks"
      bad: [["User asks", "Other account"], ["Agent passes", "account_id"], ["Tool trusts", "No check"], ["Other statement", "Returned"]]
      good: [["Session id", "Identity"], ["Ownership", "Checked"], ["My-account", "No id param"], ["Alert", "Cross-account"]]

  - id: tool-08
    title: Legacy OSS call with no timeout hangs the conversation
    domain: telco
    severity: medium
    tags: [timeouts, legacy systems, resilience]
    scenario: >-
      A carrier's agent calls a legacy OSS for line-test results. Sometimes the OSS takes
      90 seconds or never responds. The tool has no timeout, so the customer's chat hangs
      and eventually the session expires.
    analogy: >-
      Waiting on hold forever because nobody set a limit.
    breaks:
      - No timeouts on tool calls.
      - No async pattern for slow operations.
      - The user isn't informed.
    root_cause: >-
      Missing timeout and slow-path design.
    where: Tool implementation.
    fix:
      - Set timeouts per tool based on its SLA, and return a structured timeout error.
      - For slow operations, start the job and return a job id; notify or let the agent check status later.
      - Tell the customer what's happening and offer a callback.
    detect:
      - Tool latency percentiles and timeout rates.
    tradeoff: >-
      Async flows need status tracking.
    variant: >-
      FinTech: a credit-bureau call without a timeout stalls loan applications.
    line: Every tool call needs a deadline.
    related: [tool-12, agf-15]
    diagram:
      bad_label: "Anti-pattern: tool calls with no timeout"
      good_label: "Fix: per-tool timeouts and async jobs for slow work"
      bad: [["Line test", "Legacy OSS"], ["90 s+", "Or never"], ["No timeout", "Tool"], ["Chat hangs", "Expires"]]
      good: [["Timeout", "Per SLA"], ["Job id", "Async"], ["Status check", "Later"], ["Inform", "Offer callback"]]

  - id: tool-09
    title: Tool schema changed in place breaks deployed agents
    domain: fintech
    severity: high
    tags: [versioning, backward compatibility]
    scenario: >-
      A bank's platform team renames a parameter in the shared transfer tool from
      "amount" to "amount_minor" and changes units, in place. Three agents built by other
      teams keep sending "amount" in major units; the tool fills defaults, and transfers are
      created for the wrong amounts until someone notices.
    analogy: >-
      Changing the shape of a plug socket overnight across the whole building.
    breaks:
      - Tool interfaces change without versioning.
      - Consumers aren't notified or tested.
      - Defaults hide errors.
    root_cause: >-
      No versioning or compatibility policy for tools.
    where: Tool lifecycle.
    fix:
      - Version tools (transfer_v2) and keep v1 until consumers migrate.
      - Reject unknown or missing parameters instead of defaulting.
      - Run consumer contract tests in the tool's CI.
    detect:
      - Calls with unknown parameters; usage by version.
    tradeoff: >-
      Maintaining two versions temporarily.
    variant: >-
      Telco: a shared provisioning tool changes its product-code format and breaks three
      agents.
    line: Tools are APIs. Version them like APIs.
    related: [cicd-18, agf-04]
    diagram:
      bad_label: "Anti-pattern: change tool schema in place"
      good_label: "Fix: versioned tools, strict params, contract tests"
      bad: [["Rename param", "amount_minor"], ["In place", "No version"], ["Old calls", "Defaults used"], ["Wrong amounts", "Transfers"]]
      good: [["transfer_v2", "New version"], ["Keep v1", "Until migrated"], ["Reject unknown", "No defaults"], ["Contract tests", "Consumers"]]

  - id: tool-10
    title: MCP server exposes the whole BSS API with an admin token
    domain: telco
    severity: critical
    tags: [mcp, scoping, credentials]
    scenario: >-
      A carrier team wraps its entire BSS API (300 endpoints) as an MCP server using an
      admin token, so any internal agent can connect. A sales-assistant agent gains the
      ability to terminate subscriptions and change billing accounts, far beyond its
      purpose.
    analogy: >-
      Publishing the master key so any department can open any door.
    breaks:
      - The MCP server exposes everything to everyone.
      - One powerful credential sits behind all tools.
      - Clients get capabilities they don't need.
    root_cause: >-
      MCP used as a pass-through instead of a scoped capability boundary.
    where: MCP server design.
    fix:
      - Build purpose-specific MCP servers (sales read-only catalog and quotes; care with scoped writes).
      - Use per-client authorisation (OAuth scopes for the calling agent and user), not a shared admin token.
      - Expose task-shaped tools, and log every call.
    detect:
      - Tool capabilities per client versus their registered purpose.
    tradeoff: >-
      More servers to maintain.
    variant: >-
      FinTech: a bank's core-banking MCP server exposes payment initiation to a research
      assistant.
    line: MCP standardises access. You still have to scope it.
    related: [sec-14, tool-01]
    diagram:
      bad_label: "Anti-pattern: whole API as one MCP server, admin token"
      good_label: "Fix: purpose-specific servers, scoped OAuth, task tools"
      bad: [["300 endpoints", "One server"], ["Admin token", "Shared"], ["Sales agent", "Connects"], ["Can terminate", "Subscriptions"]]
      good: [["Per purpose", "MCP servers"], ["OAuth scopes", "Per client"], ["Task tools", "Not endpoints"], ["Audit", "Every call"]]

  - id: tool-11
    title: Tool description promises something the tool doesn't do
    domain: fintech
    severity: medium
    tags: [documentation, accuracy]
    scenario: >-
      A bank's block_card tool description says "Blocks the card and orders a
      replacement." The implementation only blocks. The agent tells customers a
      replacement is on its way, and replacement requests never happen.
    analogy: >-
      A vending machine labelled "coffee and biscuit" that only gives coffee.
    breaks:
      - Tool docs drift from implementation.
      - The model trusts descriptions completely.
      - No tests check described behaviour.
    root_cause: >-
      Tool descriptions not tested against behaviour.
    where: Tool documentation.
    fix:
      - Keep descriptions next to code and review them with every change.
      - Return what was actually done in the response (actions_completed list).
      - Test that described side effects happen.
    detect:
      - Claims vs tool-result mismatches.
    tradeoff: >-
      None significant.
    variant: >-
      Telco: a reset_voicemail tool claims to send the new PIN by SMS but doesn't.
    line: Tool docs are a contract with the model. Test them.
    related: [aev-12, agf-04]
    diagram:
      bad_label: "Anti-pattern: tool description drifts from behaviour"
      good_label: "Fix: docs with code, actions in response, tests"
      bad: [["Doc says", "Block + replace"], ["Code does", "Block only"], ["Agent promises", "Replacement"], ["None sent", "Complaints"]]
      good: [["Docs in code", "Reviewed"], ["Response lists", "Actions done"], ["Behaviour test", "Side effects"], ["Claims match", "Results"]]

  - id: tool-12
    title: Port-in tool blocks for hours waiting for completion
    domain: telco
    severity: medium
    tags: [async tools, long running]
    scenario: >-
      A carrier's port_in tool waits synchronously until the number is ported, which can
      take hours. The agent session times out, the tool keeps running, and the customer
      gets no update.
    analogy: >-
      Standing at the post office counter until your parcel arrives abroad.
    breaks:
      - Long business processes modelled as blocking calls.
      - No status or notification path.
      - Session lifetimes are shorter than processes.
    root_cause: >-
      Synchronous design for asynchronous operations.
    where: Tool design.
    fix:
      - Make the tool start the process and return an order id and expected timeline.
      - Provide get_port_status and send notifications on completion or failure.
      - Store state so any later session can continue.
    detect:
      - Tool calls exceeding session lifetimes.
    tradeoff: >-
      Status polling and notification infrastructure.
    variant: >-
      FinTech: an account-switching tool blocks until the switch completes over several
      days.
    line: Long processes return a ticket, not a result.
    related: [tool-08, agf-15]
    diagram:
      bad_label: "Anti-pattern: blocking call for an hours-long process"
      good_label: "Fix: start, return order id, status and notifications"
      bad: [["port_in", "Blocking"], ["Hours", "Waiting"], ["Session ends", "Timeout"], ["No update", "Customer"]]
      good: [["Start port", "Order id"], ["Status tool", "Any session"], ["Notify", "Done or failed"], ["Timeline", "Expected"]]

  - id: tool-13
    title: Agent hammers the mainframe core-banking system
    domain: fintech
    severity: high
    tags: [rate limiting, legacy systems, cost]
    scenario: >-
      A bank's agents call a mainframe-backed balance API on every turn "to stay current".
      At peak, agent traffic triples mainframe transactions, raising MIPS costs and slowing
      branch systems.
    analogy: >-
      Asking the head office for your balance every time you blink.
    breaks:
      - No caching or rate limits.
      - Agents call tools more than needed.
      - Legacy systems have costly capacity.
    root_cause: >-
      Tools hitting expensive legacy systems without protection.
    where: Tool layer.
    fix:
      - Cache read results with short TTLs where freshness allows, and fetch once per turn at most.
      - Rate-limit tools per session and overall, and protect legacy systems with a facade.
      - Instruct agents when to call (only for balance questions).
    detect:
      - Calls per session; legacy system load attributed to agents.
    tradeoff: >-
      Slightly stale reads; show "as of" times.
    variant: >-
      Telco: agents overload a legacy billing system with balance queries on bill-run
      day.
    line: Protect legacy systems from enthusiastic agents.
    related: [tool-08, obs-12]
    diagram:
      bad_label: "Anti-pattern: call the mainframe on every turn"
      good_label: "Fix: caching, rate limits, facade, call rules"
      bad: [["Every turn", "Balance call"], ["Peak", "3x txns"], ["MIPS cost", "Rises"], ["Branches slow", "Shared system"]]
      good: [["Cache", "Short TTL"], ["Rate limit", "Per session"], ["Facade", "Protects"], ["Call rules", "When needed"]]

  - id: tool-14
    title: Agent trusts a coverage tool's malformed response
    domain: telco
    severity: medium
    tags: [response validation, defensive tools]
    scenario: >-
      A carrier's serviceability API occasionally returns an empty JSON object during
      maintenance. The agent interprets missing fields as "no restrictions" and tells
      prospects fiber is available at addresses where it isn't.
    analogy: >-
      Reading a blank form as "everything approved".
    breaks:
      - Responses aren't validated.
      - Missing data is interpreted optimistically.
      - The model fills gaps.
    root_cause: >-
      No schema validation of tool responses.
    where: Tool implementation.
    fix:
      - Validate responses against a schema in the tool; treat invalid ones as errors.
      - Return explicit status (AVAILABLE, NOT_AVAILABLE, UNKNOWN).
      - Teach the agent to handle UNKNOWN honestly.
    detect:
      - Response validation failures per tool.
    tradeoff: >-
      None significant.
    variant: >-
      FinTech: a KYC vendor's empty response is read as "no adverse media".
    line: Missing data means unknown, never yes.
    related: [cicd-18, agf-11]
    diagram:
      bad_label: "Anti-pattern: unvalidated tool responses"
      good_label: "Fix: schema validation and explicit UNKNOWN status"
      bad: [["Empty JSON", "Maintenance"], ["No fields", "Read as OK"], ["'Available'", "Told prospect"], ["No fiber", "Reality"]]
      good: [["Validate", "Schema"], ["Status enum", "Incl. UNKNOWN"], ["Error", "If invalid"], ["Honest reply", "Unknown"]]

  - id: tool-15
    title: Balance unchanged right after the payment, so the agent pays again
    domain: fintech
    severity: high
    tags: [eventual consistency, read your writes]
    scenario: >-
      A bank's bill-pay agent makes a credit-card payment, then checks the card balance to
      confirm. The balance service is eventually consistent and still shows the old
      balance. The agent concludes the payment failed and pays again.
    analogy: >-
      Checking your letterbox seconds after posting a letter and assuming it wasn't sent.
    breaks:
      - Reads after writes may be stale.
      - The agent uses a read to confirm a write.
      - No idempotency on the payment.
    root_cause: >-
      Ignoring eventual consistency in tool design.
    where: Tool semantics.
    fix:
      - Return a confirmation (payment id and status) from the write tool and use that, not a later read.
      - Use idempotency keys so a repeated payment is rejected.
      - Document consistency guarantees in tool descriptions.
    detect:
      - Duplicate payments within minutes.
    tradeoff: >-
      None significant.
    variant: >-
      Telco: after adding a data pass, the usage tool still shows the old allowance and
      the agent adds another pass.
    line: Confirm a write with its receipt, not with a read.
    related: [agf-06]
    diagram:
      bad_label: "Anti-pattern: confirm a write with a stale read"
      good_label: "Fix: use the write's receipt plus idempotency"
      bad: [["Pay card", "Done"], ["Read balance", "Stale"], ["'Failed'", "Agent thinks"], ["Pays again", "Duplicate"]]
      good: [["Receipt", "Payment id"], ["Status", "From write"], ["Idem key", "Blocks repeat"], ["Docs", "Consistency"]]

  - id: tool-16
    title: A generic http_request tool for everything
    domain: telco
    severity: high
    tags: [generic tools, ssrf, scoping]
    scenario: >-
      A carrier's internal agent has a single http_request(url, method, body) tool so it can
      call "any internal API". A prompt injection makes it call an internal admin endpoint
      that resets a network element's configuration.
    analogy: >-
      Giving someone a phone that can dial any extension, including the emergency shutdown
      line.
    breaks:
      - Unlimited reach inside the network.
      - No per-endpoint authorisation.
      - Server-side request forgery by design.
    root_cause: >-
      Generic tools with unbounded scope.
    where: Tool design.
    fix:
      - Replace generic HTTP with specific tools for approved operations.
      - If a generic fetch is needed, restrict it to an allow-list of read-only endpoints and methods.
      - Enforce network segmentation for agent runtimes.
    detect:
      - Calls to non-allow-listed endpoints.
    tradeoff: >-
      More tools to build.
    variant: >-
      FinTech: an agent's generic HTTP tool reaches an internal payments admin API.
    line: Generic tools are generic attack surface.
    related: [tool-01, sec-17]
    diagram:
      bad_label: "Anti-pattern: one generic HTTP tool"
      good_label: "Fix: specific tools, allow-lists, segmentation"
      bad: [["http_request", "Any URL"], ["Injection", "Admin endpoint"], ["Config reset", "Network element"], ["Outage", "Risk"]]
      good: [["Specific tools", "Approved ops"], ["Allow-list", "Read-only"], ["Segmentation", "Network"], ["Alerts", "Off-list calls"]]

  - id: tool-17
    title: Tool returns ACH return code R03 with no explanation
    domain: fintech
    severity: medium
    tags: [semantic responses, codes, context]
    scenario: >-
      A bank's payment-status tool returns only codes like "R03" or "R10". The agent guesses
      their meaning and tells a customer their payment was "returned for insufficient funds"
      (R01) instead of "no account found" (R03), so the customer doesn't fix the account
      number.
    analogy: >-
      A doctor's note with only diagnosis codes and no description.
    breaks:
      - Responses carry codes without meaning.
      - The model guesses from training data.
      - The next action isn't given.
    root_cause: >-
      Tool outputs lack business semantics.
    where: Tool response design.
    fix:
      - Map codes to human-readable meanings and recommended next actions inside the tool.
      - Include whether the customer can fix it and how.
    detect:
      - Explanation accuracy for returned payments in evals.
    tradeoff: >-
      Code mappings need maintenance.
    variant: >-
      Telco: a port-in rejection code is returned raw and the agent explains it wrongly.
    line: Return meaning and next step, not just codes.
    related: [aev-11, agf-11]
    diagram:
      bad_label: "Anti-pattern: raw codes in tool output"
      good_label: "Fix: meaning and next action from the tool"
      bad: [["Status: R03", "Code only"], ["Agent guesses", "Means R01?"], ["'Low funds'", "Wrong reason"], ["Not fixed", "Account no."]]
      good: [["Code map", "In tool"], ["Meaning", "No account"], ["Next action", "Check number"], ["Fixable", "By customer"]]

  - id: tool-18
    title: Tool returns a formatted paragraph the agent must parse
    domain: telco
    severity: low
    tags: [structured responses, parsing]
    scenario: >-
      A carrier's get_plan_details tool returns a marketing paragraph ("Enjoy unlimited
      talk and text plus 50GB of premium data, then..."). The agent must extract the
      allowance from prose and sometimes reads 50GB as the total cap when it's the premium
      tier only.
    analogy: >-
      Getting a brochure when you asked for a spec sheet.
    breaks:
      - Responses are human prose, not data.
      - The model re-parses and misreads.
      - Fields aren't explicit.
    root_cause: >-
      Tools designed for display, not for agents.
    where: Tool response design.
    fix:
      - Return structured fields (premium_data_gb, throttled_speed, hotspot_gb, roaming zones).
      - Include a short display string separately if needed.
    detect:
      - Allowance answer accuracy in evals.
    tradeoff: >-
      None significant.
    variant: >-
      FinTech: a product tool returns a marketing description instead of APR and fee
      fields.
    line: Tools should return data. Let the agent write the prose.
    related: [tool-17]
    diagram:
      bad_label: "Anti-pattern: tool returns marketing prose"
      good_label: "Fix: structured fields, display text separate"
      bad: [["Plan details", "As prose"], ["'50GB premium'", "Then..."], ["Agent parses", "Misreads"], ["Wrong cap", "Told customer"]]
      good: [["Fields", "premium_gb"], ["Throttle", "Speed field"], ["Hotspot", "Separate"], ["Display text", "Optional"]]

  - id: tool-19
    title: Two MCP servers both offer a tool named transfer
    domain: fintech
    severity: high
    tags: [mcp, name collisions, namespacing]
    scenario: >-
      A bank's agent connects to two MCP servers: one for internal account transfers and
      one for a brokerage partner. Both expose a tool named "transfer". The agent calls the
      brokerage transfer when the customer meant moving money between their own current and
      savings accounts.
    analogy: >-
      Two contacts in your phone both called "Mum".
    breaks:
      - Tool names collide across servers.
      - Descriptions don't disambiguate.
      - The client doesn't namespace.
    root_cause: >-
      No namespacing or disambiguation across tool sources.
    where: MCP client configuration and tool naming.
    fix:
      - Namespace tools by server (banking__transfer_between_own_accounts, brokerage__transfer_to_investment).
      - Write descriptions that say when not to use each tool.
      - Load only the servers needed for the intent.
    detect:
      - Name collisions at registration; wrong-server calls in evals.
    tradeoff: >-
      Longer tool names.
    variant: >-
      Telco: care and wholesale MCP servers both expose "get_account", with different
      meanings.
    line: Tool names need namespaces once you have more than one server.
    related: [tool-03, sec-14]
    diagram:
      bad_label: "Anti-pattern: colliding tool names across servers"
      good_label: "Fix: namespaced tools and intent-based loading"
      bad: [["Server A", "transfer"], ["Server B", "transfer"], ["Ambiguous", "Same name"], ["Wrong rail", "Brokerage"]]
      good: [["Namespace", "Per server"], ["Clear names", "Own accounts"], ["When not", "In docs"], ["Load", "By intent"]]

  - id: tool-20
    title: No one knows which tools agents actually use
    domain: telco
    severity: medium
    tags: [tool telemetry, analytics]
    scenario: >-
      A carrier's platform exposes 80 tools to agents. When the BSS team plans to retire an
      API, nobody can say which agents call the tools that depend on it, how often, or with
      what error rates. The retirement breaks two agents.
    analogy: >-
      Turning off a water main without knowing which houses it supplies.
    breaks:
      - No per-tool usage or error telemetry.
      - Dependencies between tools and APIs aren't mapped.
      - Changes are risky.
    root_cause: >-
      Tools without observability or inventory.
    where: Tool platform.
    fix:
      - Emit metrics per tool (calls, callers, latency, errors) and keep a dependency map from tools to backend APIs.
      - Maintain a tool registry with owners and deprecation status.
      - Notify consuming agents before retirements.
    detect:
      - Tools without usage data; unknown callers.
    tradeoff: >-
      None significant.
    variant: >-
      FinTech: a bank retires a fraud-score API and silently breaks an agent tool.
    line: You can't retire what you can't see being used.
    related: [mas-15, tel-11]
    diagram:
      bad_label: "Anti-pattern: tools without usage telemetry"
      good_label: "Fix: per-tool metrics, dependency map, registry"
      bad: [["80 tools", "Exposed"], ["API retired", "Planned"], ["Who uses it?", "Unknown"], ["2 agents", "Broken"]]
      good: [["Tool metrics", "Calls, errors"], ["Dependency map", "Tool to API"], ["Registry", "Owners"], ["Notify", "Before retire"]]
