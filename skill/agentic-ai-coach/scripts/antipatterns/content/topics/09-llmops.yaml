id: llmops
order: 9
prefix: ops
title: MLOps / LLMOps
summary: >-
  In LLM systems the "model" is a bundle: base model, prompts, retrieval index,
  embeddings, tools, guardrails and config. LLMOps means versioning, deploying,
  monitoring and retiring that bundle as one unit, with lineage that a model-risk
  team or regulator can follow.
scenarios:
  - id: ops-01
    title: Last week's bad answer can't be reproduced
    domain: fintech
    severity: high
    tags: [versioning, release manifest, reproducibility]
    scenario: >-
      A complaint arrives about a wrong answer the bank's assistant gave about early
      repayment charges eight days ago. Engineering tries to reproduce it. Since then, the
      prompt changed twice, the index was rebuilt, and the model was upgraded. Git has the
      code, but nothing records which prompt, index snapshot and model produced the answer.
    analogy: >-
      Trying to bake the same cake again when the recipe, oven and flour have all changed
      and nobody wrote down which were used.
    breaks:
      - Behaviour depends on more than code.
      - Prompts, indexes and models change on different schedules.
      - No single record ties them together.
    root_cause: >-
      Only code is versioned.
    where: Release engineering.
    fix:
      - Version every component (prompt, model id, index snapshot, embedding model, tool versions, guardrail config).
      - Record each production configuration as a release manifest with an id, stamped on every trace.
      - Keep index snapshots long enough to replay recent incidents.
    detect:
      - Ability to rebuild any release from its manifest, tested quarterly.
    tradeoff: >-
      Snapshots cost storage; keep them on a rolling window.
    variant: >-
      Telco: a regulator asks a carrier to explain an AI answer about contract terms, and
      the configuration that produced it can't be reconstructed.
    line: Reproducibility needs the whole bundle versioned.
    related: [tel-10, obs-11, cicd-02]
    diagram:
      bad_label: "Anti-pattern: Git for code only"
      good_label: "Fix: release manifest versions the whole bundle"
      bad: [["Complaint", "8 days ago"], ["Prompt x2", "Changed"], ["Index + model", "Changed"], ["Can't replay", "Unknown config"]]
      good: [["Version all", "Prompt, model"], ["Index snapshot", "Retained"], ["Manifest id", "On traces"], ["Replay", "Any release"]]

  - id: ops-02
    title: Intent model trained on clean text, served on raw transcripts
    domain: telco
    severity: medium
    tags: [training-serving skew, preprocessing]
    scenario: >-
      A carrier fine-tunes a small intent classifier on chat logs that were lowercased,
      had phone numbers masked and emojis removed. The serving service sends raw text.
      Offline accuracy is 94%; production is 78%, worst for messages with phone numbers,
      which are exactly the porting intents.
    analogy: >-
      Training a sniffer dog on one brand of shampoo and then deploying it in a different
      building.
    breaks:
      - Preprocessing differs between training and serving.
      - The model sees unfamiliar inputs in production.
      - Nobody tested parity.
    root_cause: >-
      Separate preprocessing code paths.
    where: ML pipeline.
    fix:
      - Share one preprocessing library between training and serving.
      - Add a parity test that runs the same raw input through both paths.
      - Log preprocessed inputs for a sample in production.
    detect:
      - Offline vs production accuracy gap by intent.
    tradeoff: >-
      None significant.
    variant: >-
      FinTech: a transaction-categorisation model trained on cleaned merchant names
      receives raw descriptors at serving time.
    line: Same transform in training and serving.
    related: [ops-11]
    diagram:
      bad_label: "Anti-pattern: separate preprocessing paths"
      good_label: "Fix: one shared transform plus a parity test"
      bad: [["Training", "Cleaned text"], ["Serving", "Raw text"], ["94% offline", "78% prod"], ["Porting worst", "Phone numbers"]]
      good: [["Shared lib", "Preprocess"], ["Parity test", "Same input"], ["Log sample", "In prod"], ["Gap alert", "By intent"]]

  - id: ops-03
    title: Fine-tuning a model on monthly price plans
    domain: telco
    severity: high
    tags: [fine-tuning vs rag, knowledge freshness]
    scenario: >-
      A carrier spends three months and $40k fine-tuning a model on its price plans and
      promotions so the bot "knows the catalog". The catalog changes monthly. Two weeks
      after deployment, the model confidently quotes last month's prices, and retraining
      each month is too slow and expensive.
    analogy: >-
      Tattooing the menu on the waiter's arm when the menu changes every month.
    breaks:
      - Fine-tuning bakes knowledge into weights.
      - Knowledge goes stale as soon as the catalog changes.
      - The model can't cite where a price came from.
    root_cause: >-
      Fine-tuning used for fresh, factual knowledge.
    where: Approach selection.
    fix:
      - Use a ladder (prompting, then RAG or tools for knowledge, then fine-tuning for behaviour, format or cost).
      - Get prices from the catalog (TMF620) as a tool.
      - Fine-tune only for stable behaviour (tone, format, classification) once evals and data exist.
    detect:
      - Price accuracy against the live catalog.
    tradeoff: >-
      Tools add latency, but prices are always current and citable.
    variant: >-
      FinTech: a bank fine-tunes on its rate sheet, and the model quotes old mortgage
      rates after a rate change.
    line: RAG for knowledge, fine-tuning for behaviour.
    related: [ft-01, rag-01]
    diagram:
      bad_label: "Anti-pattern: fine-tune to teach the price list"
      good_label: "Fix: catalog tool for facts, fine-tune for behaviour"
      bad: [["Fine-tune", "Price plans"], ["3 months", "$40k"], ["Catalog changes", "Monthly"], ["Stale prices", "Confidently"]]
      good: [["Catalog tool", "TMF620"], ["RAG", "Explanations"], ["Fine-tune", "Tone, format"], ["Fresh + cited", "Prices"]]

  - id: ops-04
    title: Collections model fine-tuned on raw call transcripts
    domain: fintech
    severity: high
    tags: [training data quality, curation, compliance]
    scenario: >-
      A lender fine-tunes a model on 50,000 historical collections-call transcripts to
      sound like its best agents. The data includes calls where agents pressured customers
      and implied legal action without basis. The fine-tuned model reproduces these
      phrases, creating FDCPA risk.
    analogy: >-
      Teaching an apprentice by having them shadow everyone, including the staff who were
      later disciplined.
    breaks:
      - The model learns everything in the data, including bad behaviour.
      - Transcripts were never filtered by QA outcome.
      - PII is also embedded in training data.
    root_cause: >-
      Unvetted training data.
    where: Data curation.
    fix:
      - Filter training data by QA scores and compliance reviews; remove non-compliant calls.
      - Remove PII, deduplicate, and label examples.
      - Hold out a test set and run compliance evals on the fine-tuned model before deployment.
      - Track data lineage (which calls, which filters).
    detect:
      - Compliance phrase scans of model outputs.
    tradeoff: >-
      Filtering reduces data volume; quality matters more than quantity.
    variant: >-
      Telco: a care model fine-tuned on old chats learns to quote retired policies and
      sarcastic replies.
    line: Fine-tuning amplifies your data, good and bad.
    related: [ft-05, data-06]
    diagram:
      bad_label: "Anti-pattern: fine-tune on raw historical transcripts"
      good_label: "Fix: curated, compliant, de-identified training data"
      bad: [["50k calls", "Raw"], ["Bad agents", "Included"], ["Fine-tune", "Learns it"], ["Pressure lines", "FDCPA risk"]]
      good: [["QA filter", "Compliant only"], ["Remove PII", "Dedupe"], ["Label", "Examples"], ["Compliance eval", "Before deploy"]]

  - id: ops-05
    title: Nobody knows which data trained the credit-memo model
    domain: fintech
    severity: high
    tags: [model registry, lineage, model risk]
    scenario: >-
      A bank's model-risk team asks for documentation of a fine-tuned model that drafts
      credit memos: training data, code version, hyperparameters, evaluation results and
      approver. The model is a file in an S3 bucket named final_v3_new. The validation is
      failed and the model is suspended.
    analogy: >-
      A medicine on a shelf with no label, batch number or expiry date.
    breaks:
      - Models are stored as files with no metadata.
      - No lineage to data and code.
      - Validation can't be evidenced.
    root_cause: >-
      No model registry.
    where: MLOps tooling.
    fix:
      - Use a model registry (MLflow, Weights and Biases, SageMaker or Vertex) with lineage (data version, code commit, evals, approver).
      - Gate production deployment on registry status (approved).
      - Produce model cards for every production model.
    detect:
      - Share of production models with complete registry records.
    tradeoff: >-
      Registration adds process steps; automate them in the training pipeline.
    variant: >-
      Telco: a carrier can't show which data trained its churn-reason classifier during
      a privacy audit.
    line: Every production model should have a birth certificate.
    related: [gov-01, ops-15]
    diagram:
      bad_label: "Anti-pattern: models as files in a bucket"
      good_label: "Fix: registry with lineage, approval gate, model card"
      bad: [["final_v3_new", "In S3"], ["No lineage", "Data? Code?"], ["Model risk", "Asks"], ["Suspended", "Failed validation"]]
      good: [["Registry", "MLflow etc."], ["Lineage", "Data + commit"], ["Approval", "Gate deploy"], ["Model card", "Published"]]

  - id: ops-06
    title: All traffic switched to a new model at once
    domain: telco
    severity: high
    tags: [rollout, shadow, canary]
    scenario: >-
      A carrier switches 100% of its care bot to a new model version on Monday morning.
      Offline evals passed. In production, the new model handles abbreviations and
      prepaid-brand slang differently, and transfers to agents rise 35% before the team
      rolls back two hours later.
    analogy: >-
      Changing every traffic light in a city to a new system at once instead of testing one
      junction.
    breaks:
      - Offline evals don't catch everything.
      - No gradual exposure.
      - Rollback is manual and slow.
    root_cause: >-
      Big-bang rollout.
    where: Deployment strategy.
    fix:
      - Shadow first (new model runs silently, outputs compared), then canary (1-5%), then progressive ramp.
      - Define automatic rollback triggers on key metrics (transfer rate, errors, quality score).
      - Avoid Monday peaks for changes.
    detect:
      - Canary vs control metric comparison.
    tradeoff: >-
      Slower rollouts; far fewer incidents.
    variant: >-
      FinTech: a bank switches its fraud-alert explanations to a new model and complaint
      volume jumps.
    line: Shadow, canary, then ramp.
    related: [cicd-05, cicd-06]
    diagram:
      bad_label: "Anti-pattern: 100% switch on Monday morning"
      good_label: "Fix: shadow, canary, ramp with auto-rollback"
      bad: [["New model", "Evals passed"], ["100% traffic", "Monday"], ["Transfers +35%", "Slang"], ["Manual rollback", "2 hours"]]
      good: [["Shadow", "Compare silently"], ["Canary 5%", "Monitored"], ["Ramp", "Progressive"], ["Auto-rollback", "On breach"]]

  - id: ops-07
    title: Twelve teams call four providers directly
    domain: fintech
    severity: medium
    tags: [llm gateway, governance, keys]
    scenario: >-
      Across a bank, 12 teams call four model providers directly with their own API keys,
      retry logic and logging. Security can't see which data goes where, finance can't
      attribute cost, and a key leaked from one team's repository takes days to trace.
    analogy: >-
      Every department running its own phone lines with no switchboard.
    breaks:
      - No central control of keys, quotas, logging or policy.
      - Inconsistent retries and fallbacks.
      - No view of data flows to providers.
    root_cause: >-
      No LLM gateway.
    where: Platform architecture.
    fix:
      - Route all model access through a gateway (LiteLLM, Portkey or a cloud AI gateway) for auth, routing, rate limits, fallbacks, caching, metering and PII policy.
      - Issue per-team virtual keys with budgets.
      - Block direct provider egress at the network level.
    detect:
      - Share of LLM traffic via the gateway; direct-egress alerts.
    tradeoff: >-
      The gateway becomes critical infrastructure; run it highly available.
    variant: >-
      Telco: business units in a carrier sign separate AI contracts and nobody can enforce
      CPNI rules on prompts.
    line: Centralise model access the way you centralise database access.
    related: [obs-05, ops-19]
    diagram:
      bad_label: "Anti-pattern: direct provider calls from every team"
      good_label: "Fix: one LLM gateway with keys, policy, metering"
      bad: [["12 teams", "Own keys"], ["4 providers", "Direct calls"], ["No visibility", "Data, cost"], ["Leaked key", "Days to trace"]]
      good: [["Gateway", "All traffic"], ["Virtual keys", "Per team"], ["Policy", "PII, routing"], ["Egress block", "Direct calls"]]

  - id: ops-08
    title: Self-hosted model runs out of GPU memory at 50 users
    domain: telco
    severity: high
    tags: [self hosting, capacity, kv cache]
    scenario: >-
      For data-sovereignty reasons, a European carrier self-hosts an open-weight model for
      its care agents. Single-request benchmarks look great. At 50 concurrent agents with
      long call transcripts, the server runs out of GPU memory and requests fail.
    analogy: >-
      Testing a restaurant kitchen with one order and opening on a Saturday night.
    breaks:
      - KV-cache memory grows with concurrency times context length.
      - Benchmarks used single short requests.
      - No autoscaling or admission control.
    root_cause: >-
      Capacity planning ignored realistic concurrency and context lengths.
    where: Serving infrastructure.
    fix:
      - Load-test with realistic concurrency and lengths.
      - Use serving engines with continuous batching and paged attention (vLLM, TGI, TensorRT-LLM).
      - Set max context and concurrency limits, autoscale on queue depth, and shed load gracefully.
    detect:
      - GPU memory, queue depth and rejection rates.
    tradeoff: >-
      Headroom costs GPUs; size for peak with a buffer.
    variant: >-
      FinTech: a bank's on-prem model for document review fails during month-end
      processing.
    line: Plan GPU capacity for concurrency times context length.
    related: [ops-17, cost-03]
    diagram:
      bad_label: "Anti-pattern: benchmark single short requests"
      good_label: "Fix: realistic load tests, batching, admission control"
      bad: [["Self-hosted", "Sovereignty"], ["1-request test", "Fast"], ["50 agents", "Long context"], ["GPU OOM", "Failures"]]
      good: [["Load test", "Real lengths"], ["vLLM", "Paged attention"], ["Limits", "Context, concur."], ["Autoscale", "Queue depth"]]

  - id: ops-09
    title: Cost per call falls while cost per resolved dispute triples
    domain: fintech
    severity: medium
    tags: [unit economics, cost per outcome]
    scenario: >-
      A card issuer moves its dispute assistant to a cheaper model to cut cost per call by
      60%. The cheaper model resolves fewer disputes in one session, so customers return
      and escalate to agents. Cost per resolved dispute, including agent time, triples.
    analogy: >-
      Buying cheaper tyres that wear out three times as fast.
    breaks:
      - The optimised unit (cost per call) wasn't the business unit.
      - Failures shift cost elsewhere.
      - Nobody measured end-to-end cost.
    root_cause: >-
      Optimising the wrong unit.
    where: Cost management.
    fix:
      - Measure cost per successful outcome (resolved dispute), including human time and repeat contacts.
      - Use caching, model routing and prompt compression only where evals show outcomes hold.
    detect:
      - Cost per outcome dashboard by version.
    tradeoff: >-
      Outcome attribution needs cross-system data.
    variant: >-
      Telco: a cheaper model for plan changes lowers bot cost but raises store visits.
    line: Optimise cost per success, not cost per call.
    related: [cost-01, eval-14]
    diagram:
      bad_label: "Anti-pattern: optimise cost per call"
      good_label: "Fix: optimise cost per resolved outcome"
      bad: [["Cheaper model", "-60% per call"], ["Fewer resolved", "In session"], ["Escalations", "To agents"], ["Cost/outcome x3", "Total"]]
      good: [["Outcome cost", "Incl. humans"], ["Repeat contact", "Counted"], ["Route + cache", "Where safe"], ["Evals hold", "Then switch"]]

  - id: ops-10
    title: Thirty percent of questions are the same and all pay full price
    domain: telco
    severity: medium
    tags: [caching, prompt caching, semantic cache]
    scenario: >-
      On bill-run days, 30% of a carrier's chatbot questions are near-duplicates ("why is
      my bill higher this month", "what is this new fee"). Every one is answered from
      scratch, with retrieval and a full model call, and the 12k-token system prompt is
      re-processed each time.
    analogy: >-
      A bakery that bakes each loaf to order even when everyone wants the same bread.
    breaks:
      - No exact or semantic caching for general answers.
      - No provider prompt caching for the stable prefix.
      - Repeated work costs money and latency.
    root_cause: >-
      No caching strategy.
    where: Serving architecture.
    fix:
      - Enable provider prompt caching for the stable prefix (see ctx-06).
      - Cache answers to general, non-personalised questions (exact and semantic) with TTLs and invalidation on content change.
      - Never cache personalised answers across users (see ctx-17).
    detect:
      - Cache hit rates and cost per conversation.
    tradeoff: >-
      Caches can serve stale content; invalidate on catalog and policy changes.
    variant: >-
      FinTech: during a card outage, thousands ask "Is there a problem with cards?" and
      each triggers a full RAG pipeline.
    line: The cheapest token is the one you never generate.
    related: [ctx-06, ctx-17, cost-06]
    diagram:
      bad_label: "Anti-pattern: every request hits the model"
      good_label: "Fix: prompt caching plus general-answer caches"
      bad: [["Bill-run day", "Peak"], ["30% duplicates", "Same Qs"], ["Full pipeline", "Every time"], ["Cost + latency", "High"]]
      good: [["Prompt cache", "Stable prefix"], ["Answer cache", "General only"], ["TTL + purge", "On change"], ["No personal", "Caching"]]

  - id: ops-11
    title: Notebook works, the production rewrite doesn't
    domain: fintech
    severity: medium
    tags: [notebooks, reproducibility, handoff]
    scenario: >-
      A data scientist builds a KYC document classifier in a notebook with 96% accuracy.
      Engineering rewrites it as a service. The service scores 88%: a different PDF
      library, an unpinned model version and a forgotten text-normalisation cell.
    analogy: >-
      Copying a recipe by watching a video and missing the step the chef did off-camera.
    breaks:
      - Hidden notebook state and cell order.
      - Untracked dependencies.
      - Manual translation introduces bugs.
    root_cause: >-
      Notebooks handed over instead of artifacts.
    where: Development workflow.
    fix:
      - Move logic into shared, tested modules used by both notebook and service.
      - Pin environments and containerise pipelines.
      - Run the same eval suite against both.
    detect:
      - Accuracy parity check between experiment and service.
    tradeoff: >-
      Less freedom in notebooks; much faster delivery.
    variant: >-
      Telco: a churn-reason prototype in a notebook loses accuracy when rebuilt as a
      streaming job.
    line: Promote artifacts, not notebooks.
    related: [ops-02]
    diagram:
      bad_label: "Anti-pattern: rewrite the notebook by hand"
      good_label: "Fix: shared modules, pinned env, same evals"
      bad: [["Notebook", "96%"], ["Rewrite", "As service"], ["Missed cell", "+ new libs"], ["88%", "In service"]]
      good: [["Shared module", "Tested"], ["Pinned env", "Container"], ["Same evals", "Both"], ["Parity", "Checked"]]

  - id: ops-12
    title: A year of care-bot feedback never used
    domain: telco
    severity: medium
    tags: [data flywheel, continuous improvement]
    scenario: >-
      A carrier has collected a year of chatbot feedback, transfers and agent notes. None
      of it feeds back into prompts, retrieval content or evals. The same five failure
      types make up most transfers month after month.
    analogy: >-
      A restaurant that collects comment cards and throws them away unread.
    breaks:
      - No loop from feedback to improvement.
      - No owner for triage.
      - Content gaps stay open.
    root_cause: >-
      No data flywheel process.
    where: Operating model.
    fix:
      - Run a weekly loop (collect, triage, label, add to evals, fix prompts, retrieval or content, re-evaluate, ship).
      - Assign owners for content gaps (knowledge team) and system fixes (AI team).
      - Track top failure types month over month.
    detect:
      - Recurrence rate of top failure types.
    tradeoff: >-
      Requires standing team time.
    variant: >-
      FinTech: a bank's assistant keeps failing on the same mortgage questions because
      feedback goes nowhere.
    line: Close the loop from feedback to the next release.
    related: [obs-03, eval-05]
    diagram:
      bad_label: "Anti-pattern: feedback collected, never used"
      good_label: "Fix: weekly flywheel from feedback to release"
      bad: [["Feedback", "A year"], ["Transfers", "Agent notes"], ["Unused", "No owner"], ["Same 5 issues", "Monthly"]]
      good: [["Triage", "Weekly"], ["Eval cases", "Added"], ["Fix", "Prompt, content"], ["Ship", "Re-evaluated"]]

  - id: ops-13
    title: Minor framework update changes default chunk size
    domain: fintech
    severity: medium
    tags: [dependency pinning, upgrades]
    scenario: >-
      A bank's policy assistant uses an LLM framework with unpinned versions. A minor
      release changes a default text-splitter setting and a retriever's default k. The next
      index rebuild produces different chunks, and answer quality drops without any code
      change by the team.
    analogy: >-
      A supplier quietly changing an ingredient in a recipe you depend on.
    breaks:
      - Floating dependency versions.
      - LLM libraries change fast, including defaults.
      - No evals run on dependency updates.
    root_cause: >-
      Unpinned dependencies.
    where: Dependency management.
    fix:
      - Pin versions with lock files.
      - Upgrade on a schedule through a PR that runs the full eval suite.
      - Set important parameters explicitly instead of relying on defaults.
    detect:
      - Dependency-diff alerts in CI.
    tradeoff: >-
      Pinned versions need deliberate upgrades for security patches.
    variant: >-
      Telco: an SDK update changes retry behaviour and doubles calls to a BSS API.
    line: Pin fast-moving libraries and upgrade on purpose.
    related: [cicd-07, agf-09]
    diagram:
      bad_label: "Anti-pattern: floating library versions"
      good_label: "Fix: lock files, explicit params, eval-gated upgrades"
      bad: [["Unpinned", "Framework"], ["Minor release", "New defaults"], ["Rebuild index", "New chunks"], ["Quality drop", "No code change"]]
      good: [["Lock file", "Pinned"], ["Explicit", "Chunk size, k"], ["Upgrade PR", "Scheduled"], ["Full evals", "On upgrade"]]

  - id: ops-14
    title: Staging uses a small model and a tiny index
    domain: telco
    severity: medium
    tags: [environment parity, staging]
    scenario: >-
      To save money, a carrier's staging environment uses a small model and a 2% sample of
      the knowledge base. Everything passes there. Production surprises are constant:
      different latency, different retrieval results and different tool timing.
    analogy: >-
      Rehearsing a play in a living room and performing it in a stadium.
    breaks:
      - Behaviour depends on model, data size and latency.
      - Staging differs in all three.
      - Tests give false confidence.
    root_cause: >-
      No environment parity.
    where: Environments.
    fix:
      - Use the same models in staging, and a representative data snapshot (anonymised or synthetic where needed).
      - Make staging cheaper by lower volume, not different components.
      - Run performance tests in a production-like environment.
    detect:
      - Rate of issues found only in production.
    tradeoff: >-
      Higher staging cost; lower incident cost.
    variant: >-
      FinTech: a bank tests its assistant against a mock core-banking system that never
      returns delays or partial data.
    line: Staging should be cheaper, not different.
    related: [aev-05]
    diagram:
      bad_label: "Anti-pattern: staging with different model and data"
      good_label: "Fix: same components, less volume"
      bad: [["Small model", "In staging"], ["2% of KB", "Index"], ["All pass", "Staging"], ["Prod surprises", "Constant"]]
      good: [["Same models", "Staging"], ["Rep. snapshot", "Anonymised"], ["Low volume", "To save cost"], ["Perf tests", "Prod-like"]]

  - id: ops-15
    title: Compliance asks which systems use AI for credit decisions
    domain: fintech
    severity: high
    tags: [ai inventory, eu ai act, governance]
    scenario: >-
      A bank's compliance team must classify AI systems under the EU AI Act, where
      creditworthiness assessment of individuals is high-risk. Nobody can list which teams
      use which models with which data. Two teams are found using LLMs to summarise credit
      applications for underwriters without any risk review.
    analogy: >-
      A building inspector asking where all the gas pipes are, and nobody has a plan.
    breaks:
      - No central inventory of AI use.
      - Shadow AI across teams.
      - Risk classification is impossible.
    root_cause: >-
      No AI governance inventory.
    where: Governance.
    fix:
      - Maintain a central AI inventory (use case, owner, model, data sources, risk class, approvals).
      - Require registration before production access through the gateway.
      - Produce model cards and risk assessments for high-risk uses.
    detect:
      - Gateway traffic not linked to an inventory entry.
    tradeoff: >-
      Process overhead; required by regulation for high-risk uses.
    variant: >-
      Telco: a carrier can't tell regulators which AI systems process CPNI.
    line: You can't govern what you haven't inventoried.
    related: [gov-01, gov-10, ops-05]
    diagram:
      bad_label: "Anti-pattern: shadow AI with no inventory"
      good_label: "Fix: central inventory tied to gateway access"
      bad: [["AI Act", "Classify systems"], ["No inventory", "Who uses what?"], ["Shadow use", "Credit summaries"], ["No review", "High-risk"]]
      good: [["Inventory", "Use case, owner"], ["Risk class", "Per use"], ["Gateway", "Requires entry"], ["Model card", "High-risk"]]

  - id: ops-16
    title: Model deprecation forces an emergency migration
    domain: telco
    severity: high
    tags: [provider dependency, deprecation, portability]
    scenario: >-
      A carrier's care bot depends on a model version the provider announces will be
      retired in 60 days. The code is tightly coupled to that provider's API format, there
      is no second model tested, and prompts are tuned to that version. The migration
      becomes a fire drill.
    analogy: >-
      Building your shop on a rented plot with no plan for when the lease ends.
    breaks:
      - Models get deprecated on fixed schedules.
      - No abstraction, portable evals or tested alternative.
      - Deprecation dates weren't tracked.
    root_cause: >-
      Single-provider dependency with no exit plan.
    where: Architecture and planning.
    fix:
      - Abstract model access via the gateway.
      - Keep portable evals and a tested secondary model.
      - Track deprecation dates and plan upgrades quarterly.
    detect:
      - Days until deprecation for each model in use.
    tradeoff: >-
      Maintaining a tested second model costs eval runs.
    variant: >-
      FinTech: a bank's KYC extraction depends on a model being retired, with no
      re-validation plan for model risk.
    line: Always have a tested second model.
    related: [eval-19, prm-09, ops-07]
    diagram:
      bad_label: "Anti-pattern: one provider, no exit plan"
      good_label: "Fix: gateway, portable evals, tested backup model"
      bad: [["Deprecation", "60 days"], ["Tight coupling", "Provider API"], ["No backup", "Tested"], ["Fire drill", "Migration"]]
      good: [["Gateway", "Abstraction"], ["Portable evals", "Any model"], ["Backup model", "Tested"], ["Calendar", "Deprecations"]]

  - id: ops-17
    title: Tax-day traffic hits provider quotas
    domain: fintech
    severity: high
    tags: [rate limits, quotas, capacity planning]
    scenario: >-
      A tax-filing fintech's assistant gets 12 times normal traffic on the filing deadline.
      The provider's tokens-per-minute quota is hit within an hour. Every request returns
      429, and customers trying to file on deadline day can't get help.
    analogy: >-
      A toll road with one booth on the busiest day of the year.
    breaks:
      - Throughput is capped by provider quotas.
      - No forecast of peak tokens per minute.
      - No queueing or load shedding.
    root_cause: >-
      Provider quotas left out of capacity planning.
    where: Capacity planning.
    fix:
      - Forecast tokens per minute for peaks and request quota increases or provisioned throughput in advance.
      - Queue with backpressure and shed low-priority traffic (for example general FAQs) first.
      - Spread load across regions or providers via the gateway.
    detect:
      - Headroom against quota during peaks.
    tradeoff: >-
      Provisioned throughput costs more; only for peak windows.
    variant: >-
      Telco: a launch-day surge for a new phone exhausts the carrier's quota.
    line: Provider quotas are part of capacity planning.
    related: [obs-12, ops-08]
    diagram:
      bad_label: "Anti-pattern: discover quotas in production"
      good_label: "Fix: forecast TPM, reserve capacity, shed load"
      bad: [["Deadline day", "12x traffic"], ["TPM quota", "Hit in 1 hour"], ["All 429", "Errors"], ["No help", "On deadline"]]
      good: [["Forecast", "Peak TPM"], ["Reserve", "Quota, throughput"], ["Queue", "Backpressure"], ["Shed", "Low priority"]]

  - id: ops-18
    title: Re-embedding 50 million chunks by hand
    domain: telco
    severity: medium
    tags: [index pipelines, reindexing, aliases]
    scenario: >-
      A carrier's knowledge platform must re-embed 50 million chunks after an embedding
      model upgrade. The original index was built by one-off scripts. The rebuild takes a
      week of manual work, fails twice midway, and requires downtime.
    analogy: >-
      Rebuilding a library catalog by hand every time the filing system changes.
    breaks:
      - No automated, resumable index-build pipeline.
      - Builds can't run alongside production.
      - Schema and model changes are inevitable.
    root_cause: >-
      Index builds treated as projects, not pipelines.
    where: Data platform.
    fix:
      - Build automated, resumable indexing pipelines with checkpoints and batch embedding.
      - Build new indexes alongside the old one and switch with an alias.
      - Run retrieval evals before the switch.
    detect:
      - Index-build duration and failure rate.
    tradeoff: >-
      Two indexes at once doubles storage temporarily.
    variant: >-
      FinTech: a bank's document index migration to a new vector database takes a
      month of manual effort.
    line: Index builds should be a pipeline, not a project.
    related: [rag-07]
    diagram:
      bad_label: "Anti-pattern: one-off scripts to rebuild the index"
      good_label: "Fix: resumable pipeline, parallel build, alias switch"
      bad: [["50M chunks", "Re-embed"], ["Manual scripts", "One-off"], ["Fails twice", "Midway"], ["Downtime", "A week"]]
      good: [["Pipeline", "Resumable"], ["Batch embed", "Checkpoints"], ["Parallel index", "Built"], ["Alias switch", "After evals"]]

  - id: ops-19
    title: API key in a public notebook runs up the bill
    domain: fintech
    severity: high
    tags: [secrets, key management, spend caps]
    scenario: >-
      A fintech engineer publishes a demo notebook with a model API key hard-coded. Within
      hours, the key is scraped and used to generate content at scale. The bill reaches
      $28,000 before the provider flags it.
    analogy: >-
      Leaving your credit card on a park bench with the PIN written on it.
    breaks:
      - Keys are hard-coded in notebooks and repos.
      - No secret scanning.
      - Keys have no spend caps or scopes.
    root_cause: >-
      LLM keys not managed as secrets.
    where: Secret management.
    fix:
      - Use a secret manager and short-lived credentials; never put keys in code.
      - Run secret scanning in CI and in repository settings.
      - Issue per-service keys with spend caps via the gateway, and rotate on exposure.
    detect:
      - Secret-scanning alerts; spend anomalies per key.
    tradeoff: >-
      None significant.
    variant: >-
      Telco: a test key with production access is committed to a public repository.
    line: LLM keys are credit cards. Protect them like credit cards.
    related: [ops-07, cicd-14]
    diagram:
      bad_label: "Anti-pattern: hard-coded API key in a notebook"
      good_label: "Fix: secret manager, scanning, capped virtual keys"
      bad: [["Notebook", "Key inside"], ["Published", "Public"], ["Scraped", "Within hours"], ["$28k bill", "Abuse"]]
      good: [["Secret mgr", "No keys in code"], ["Scanning", "CI + repo"], ["Virtual keys", "Spend caps"], ["Rotate", "On exposure"]]

  - id: ops-20
    title: Forty old prompts, nine indexes and three fine-tunes still billed
    domain: telco
    severity: low
    tags: [lifecycle, cleanup, cost]
    scenario: >-
      A carrier's AI platform audit finds 40 old prompt versions still callable, nine
      unused vector indexes, and three fine-tuned model endpoints deployed and billed hourly
      for pilots that ended a year ago.
    analogy: >-
      Paying rent on storage units you forgot you had.
    breaks:
      - Artifacts are never retired.
      - No usage tracking per artifact.
      - No owners.
    root_cause: >-
      No lifecycle management.
    where: Platform governance.
    fix:
      - Set lifecycle policies (deprecate after N days without traffic, then delete).
      - Track usage per artifact and assign owners.
      - Review monthly, and remove retired artifacts from access as well as billing.
    detect:
      - Idle-artifact report.
    tradeoff: >-
      Deleting something still needed; use a deprecation period with alerts.
    variant: >-
      FinTech: a bank keeps old fine-tuned models deployed, which also expands its security
      surface.
    line: Retire what you don't run.
    related: [ops-05]
    diagram:
      bad_label: "Anti-pattern: never retire artifacts"
      good_label: "Fix: lifecycle policy, usage tracking, owners"
      bad: [["40 prompts", "Callable"], ["9 indexes", "Unused"], ["3 endpoints", "Billed hourly"], ["Pilots ended", "Year ago"]]
      good: [["Lifecycle", "Policy"], ["Usage", "Per artifact"], ["Owners", "Assigned"], ["Monthly", "Cleanup"]]
